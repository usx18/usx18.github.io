<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Library</title>

<style>

body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
}

/* CATEGORY BAR */

#bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

button.active {
    background: #3b82f6;
}

/* GRID */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 15px;
}

/* ITEM */

.item {
    background: #1e1e1e;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;

    white-space: break-spaces;
    font-family: monospace;
    line-height: 1.1;

    overflow-x: auto;
}

.item:hover {
    background: #2d2d2d;
}

.copied {
    background: #14532d !important;
}

</style>
</head>

<body>

<h1>ASCII Library</h1>

<div id="bar"></div>

<div class="grid" id="grid"></div>

<script>

let data = [];
let categories = [];
let active = "ALL";

// LOAD FILE

fetch("ascii.txt")
.then(r => r.text())
.then(text => {

    parse(text);
    buildButtons();
    render();

});

// PARSE === SYSTEM

function parse(text) {

    const entries = text
        .split("===")
        .map(e => e.trim())
        .filter(e => e.length > 0);

    data = [];
    categories = [];

    entries.forEach(entry => {

        const lines = entry.split("\n");

        const first = lines[0];

        let cat = "UNCATEGORIZED";
        let content = entry;

        if (first.includes("|")) {
            const split = first.split("|");
            cat = split[0].trim();
            lines[0] = split.slice(1).join("|"); // keep ASCII intact
            content = lines.join("\n");
        }

        if (!categories.includes(cat)) {
            categories.push(cat);
        }

        data.push({
            cat,
            value: content
        });

    });

}

// BUILD BUTTONS

function buildButtons() {

    const bar = document.getElementById("bar");

    const all = ["ALL", ...categories];

    all.forEach(cat => {

        const btn = document.createElement("button");
        btn.textContent = cat;

        if (cat === "ALL") btn.classList.add("active");

        btn.onclick = () => {

            active = cat;

            document.querySelectorAll("button")
                .forEach(b => b.classList.remove("active"));

            btn.classList.add("active");

            render();

        };

        bar.appendChild(btn);

    });

}

// RENDER

function render() {

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    data
        .filter(x => active === "ALL" || x.cat === active)
        .forEach(x => {

            const div = document.createElement("div");
            div.className = "item";

            div.textContent = x.value;

            div.onclick = async () => {

                await navigator.clipboard.writeText(x.value);

                div.classList.add("copied");

                setTimeout(() => {
                    div.classList.remove("copied");
                }, 400);

            };

            grid.appendChild(div);

        });

}

</script>

</body>
</html>
